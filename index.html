async function supaGet(table, id) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&select=data`, {
    headers: { "apikey": SUPA_KEY, "Authorization": "Bearer "+SUPA_KEY }
  });
  const rows = await r.json();
  return rows?.[0]?.data ?? null;
}
async function supaSet(table, id, value) {
  await fetch(`${SUPA_URL}/rest/v1/${table}`, {
    method: "POST",

        const userId = k.replace("budgy_photo_", "");

// ─── Live FX rate ─────────────────────────────────────────────────────────────
const FALLBACK_RATES = { USD:0.856, CHF:0.965 };
async function fetchFxToEur(currency) {
  const cur = currency.toLowerCase();
  const attempts = [
    () => fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${cur}.json`).then(r=>r.json()).then(d=>d[cur]?.eur||null),
    () => fetch(`https://latest.currency-api.pages.dev/v1/currencies/${cur}.json`).then(r=>r.json()).then(d=>d[cur]?.eur||null),
    () => fetch(`https://open.er-api.com/v6/latest/${currency}`).then(r=>r.json()).then(d=>d.rates?.EUR||null),
    () => fetch(`https://api.frankfurter.app/latest?from=${currency}&to=EUR`).then(r=>r.json()).then(d=>d.rates?.EUR||null),
  ];
  for (const attempt of attempts) {
    try { const rate = await attempt(); if (rate && rate > 0) return rate; } catch {}
  }
  return FALLBACK_RATES[currency] || null;
}
async function fetchUsdEur() { return fetchFxToEur("USD"); }

// ─── Date utils ───────────────────────────────────────────────────────────────
const MONTHS = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12, janv:1,févr:2,mars:3,avr:4,mai:5,juin:6,juil:7,aoû:8,sept:9 };
function parseDate(val) {
  if (!val && val !== 0) return "";
  const s = String(val).trim(); if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const m2 = s.match(/^(\d{1,2})[\s\-\/]([A-Za-zÀ-ÿ]+)[\s\-\/](\d{4})$/);
  if (m2) { const mo=MONTHS[m2[2].toLowerCase().slice(0,4)]||MONTHS[m2[2].toLowerCase().slice(0,3)]; if(mo) return `${m2[3]}-${String(mo).padStart(2,"0")}-${m2[1].padStart(2,"0")}`; }
  const m3 = s.match(/^([A-Za-zÀ-ÿ]+)[\s\-\/](\d{1,2})[\s\-\/,]*(\d{4})$/);
  if (m3) { const mo=MONTHS[m3[1].toLowerCase().slice(0,4)]||MONTHS[m3[1].toLowerCase().slice(0,3)]; if(mo) return `${m3[3]}-${String(mo).padStart(2,"0")}-${m3[2].padStart(2,"0")}`; }
  return "";
}
function displayDate(iso) {
  if (!iso||iso.length<10) return "—";
  const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`;
}
function parsePastedText(text) {
  return text.trim().split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split("\t").map(c=>c.trim()));
}

function statusOf(op) {
  if (op.docPartner?.trim()) return "doc_recu";
  const now=today(), start=op.dateStart||"", end=op.dateEnd||"";
  if (!start||!end) return "a_venir";
  if (start<=now&&end>=now) return "en_cours";
  if (end<now) {
    // Rapport envoyé → en attente de paiement → "À venir" (côté LDLC, balle dans le camp du partenaire)
    if (op.rapportDate) return "du_payer";
    return "du_declarer";
  }
  return "a_venir";
}
function computeTotal(products) {
  return (products||[]).reduce((s,p)=>(parseFloat(p.budget)||0)*(parseFloat(p.qty)||0)+s,0);
}
function toEur(amount, currency, rate) {
  return currency==="EUR"?amount:amount*(rate||0.92);
}
function fmt(n, currency="EUR") {
  const val = n||0;
  if (currency === "USD") {
    const abs = Math.abs(val).toLocaleString("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2});
    return (val < 0 ? "-$" : "$") + abs;
  }
  if (currency === "CHF") {
    return new Intl.NumberFormat("fr-CH",{style:"currency",currency:"CHF",maximumFractionDigits:2}).format(val);
  }
  return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2}).format(val);
}

function KpiCard({ label, emoji, accentColor, textColor, amount, count, onClick, active, darkMode }) {
  const countStr = count===0?"Aucune opération":count===1?"1 opération":`${count} opérations`;
  const bgOpacity = darkMode ? (active?"55":"38") : (active?"70":"45");
  const labelColor = darkMode ? "#fff" : "#374151";
  return (
    <div onClick={onClick} style={{ background:active?`${accentColor}${bgOpacity}`:`${accentColor}${bgOpacity}`, borderRadius:14, padding:"18px 22px", flex:1, minWidth:160, border:`1px solid ${accentColor}55`, borderTop:`3px solid ${accentColor}`, outline:active?`2px solid ${accentColor}88`:"", cursor:"pointer", transition:"all .15s", display:"flex", alignItems:"center", gap:14 }}>

      <div>
        <div style={{ color:labelColor, fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{label}</div>

  );
}

// ─── Name formatting helpers ──────────────────────────────────────────────────
const fmtPrenom = s => s ? s.trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ") : "";
const fmtNom = s => s ? s.trim().toUpperCase() : "";
const fullName = (u) => u ? [fmtPrenom(u.firstName), fmtNom(u.lastName)].filter(Boolean).join(" ") : "";

// ─── Auth ─────────────────────────────────────────────────────────────────────
const ADMIN_ID = "__ADMIN__";

async function hashPassword(pwd) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ─── Login / Register Modal ───────────────────────────────────────────────────
function AuthModal({ onLogin }) {
  const [tab, setTab] = useState("login");
  const [loginEmail, setLoginEmail] = useState("");
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [regEmail, setRegEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [pwd2, setPwd2] = useState("");
  const [error, setError] = useState("");
  const [pending, setPending] = useState(false);

  const ADMIN_DEFAULT_PWD = "LDLC-ADMIN-2025";

  const handleLogin = async () => {
    if (!loginEmail.trim()||!pwd) { setError("Renseignez votre email et mot de passe."); return; }
    setPending(true); setError("");
    try {
      const isAdmin = loginEmail.trim().toUpperCase()==="ADMIN";
      const users = await db.get("budgy_users_v1") || [];
      if (users.length===0||!users.find(u=>u.id===ADMIN_ID)) {
        const adminHash = await hashPassword(ADMIN_DEFAULT_PWD);
        const admins = users.filter(u=>u.id!==ADMIN_ID);
        await db.set("budgy_users_v1",[...admins,{ id:ADMIN_ID, firstName:"", lastName:"Admin", name:"Admin", email:"admin", role:"admin", hash:adminHash, approved:true }]);
      }
      const freshUsers = await db.get("budgy_users_v1") || [];
      const user = isAdmin
        ? freshUsers.find(u=>u.id===ADMIN_ID)
        : freshUsers.find(u=>{
          const input = loginEmail.trim().toLowerCase();
          if ((u.email||"").toLowerCase()===input) return true;
          if ((fullName(u)||u.name||"").toLowerCase()===input) return true;
          return false;
        });
      if (!user) { setError("Email introuvable."); setPending(false); return; }
      const hash = await hashPassword(pwd);
      if (hash!==user.hash) { setError("Mot de passe incorrect."); setPending(false); return; }
      if (!user.approved) { setError("Votre compte est en attente de validation par l'admin."); setPending(false); return; }
      const displayName = fullName(user)||user.name||user.email;
      session.set({ id:user.id, name:displayName, role:user.role });
      onLogin({ id:user.id, name:displayName, role:user.role });
    } catch(e) { setError("Erreur : "+e.message); }
    setPending(false);
  };

  const handleRegister = async () => {
    if (!firstName.trim()||!lastName.trim()||!regEmail.trim()||!pwd||!pwd2) { setError("Remplissez tous les champs."); return; }
    if (pwd!==pwd2) { setError("Les mots de passe ne correspondent pas."); return; }
    if (pwd.length<6) { setError("Mot de passe trop court (6 caractères minimum)."); return; }
    if (!regEmail.includes("@")) { setError("Email invalide."); return; }
    setPending(true); setError("");
    try {
      const users = await db.get("budgy_users_v1") || [];
      if (users.find(u=>(u.email||"").toLowerCase()===regEmail.trim().toLowerCase())) {
        setError("Cet email est déjà utilisé."); setPending(false); return;
      }
      const hash = await hashPassword(pwd);
      const fn = fmtPrenom(firstName), ln = fmtNom(lastName);
      const newUser = { id:"U-"+Date.now(), firstName:fn, lastName:ln, name:fn+" "+ln, email:regEmail.trim().toLowerCase(), role:"user", hash, approved:false };
      await db.set("budgy_users_v1",[...users, newUser]);
      setError(""); setTab("login");
      setPwd(""); setPwd2(""); setLoginEmail(regEmail.trim().toLowerCase());
      setFirstName(""); setLastName(""); setRegEmail("");
    } catch(e) { setError("Erreur : "+e.message); }
    setPending(false);
  };

  const tabBtn = (t,l) => (
    <button onClick={()=>{setTab(t);setError("");}} style={{ flex:1, background:tab===t?"#3b82f6":"rgba(255,255,255,0.05)", border:tab===t?"none":"1px solid rgba(255,255,255,0.1)", color:tab===t?"#fff":"#94a3b8", borderRadius:8, padding:"9px 0", cursor:"pointer", fontSize:14, fontWeight:tab===t?700:400 }}>{l}</button>
  );

  return (
    <div style={{ position:"fixed", inset:0, background:"#000", display:"flex", alignItems:"center", justifyContent:"center", zIndex:5000, padding:16 }}>
      <div style={{ background:"#0f172a", border:"1px solid rgba(255,255,255,0.12)", borderRadius:20, width:"100%", maxWidth:400, padding:36 }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:26, fontWeight:900, color:"#f1f5f9", marginBottom:4 }}>BUDGY</div>
          <div style={{ color:"#475569", fontSize:13 }}>Suivi des budgets promotionnels</div>
        </div>
        <div style={{ display:"flex", gap:8, marginBottom:24 }}>
          {tabBtn("login","Connexion")}
          {tabBtn("register","Créer un compte")}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          {tab==="login"?(
            <div>
              <label style={lbl}>Login</label>
              <input value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} placeholder="" style={inp} onKeyDown={e=>e.key==="Enter"&&handleLogin()} autoFocus />
            </div>
          ):(
            <>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <div><label style={lbl}>Prénom</label><input value={firstName} onChange={e=>setFirstName(e.target.value)} placeholder="Jean" style={inp} autoFocus /></div>
                <div><label style={lbl}>Nom</label><input value={lastName} onChange={e=>setLastName(e.target.value)} placeholder="DUPONT" style={inp} /></div>
              </div>
              <div>
                <label style={lbl}>Email</label>
                <input type="email" value={regEmail} onChange={e=>setRegEmail(e.target.value)} placeholder="prenom.nom@ldlc.com" style={inp} />
              </div>
            </>
          )}
          <div>
            <label style={lbl}>Mot de passe</label>
            <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} style={inp} onKeyDown={e=>e.key==="Enter"&&(tab==="login"?handleLogin():null)} />
          </div>
          {tab==="register"&&(
            <div>
              <label style={lbl}>Confirmer le mot de passe</label>
              <input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} style={inp} />
            </div>
          )}
          {error&&<div style={{ color:"#fca5a5", fontSize:13, background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:8, padding:"10px 14px" }}>{error}</div>}
          <button onClick={tab==="login"?handleLogin:handleRegister} disabled={pending}
            style={{ ...btnP, opacity:pending?0.6:1, cursor:pending?"wait":"pointer", marginTop:4 }}>
            {pending?"...":(tab==="login"?"Se connecter":"Créer le compte")}
          </button>
          
        </div>
      </div>
    </div>
  );
}

  };
  const remove = async (id) => {
    if (id===ADMIN_ID) { setMsg("Impossible de supprimer l'admin."); return; }
    const next = users.filter(u=>u.id!==id);
    await db.set("budgy_users_v1",next); setUsers(next); setMsg("Compte supprimé.");
  };
  const changePassword = async (id) => {
    const pwd = newPwd[id]||"";

    const hash = await hashPassword(pwd);
    const next = users.map(u=>u.id===id?{...u,hash}:u);

        <div>

function PasteModal({ onApply, onClose, existingProducts, opCurrency="EUR" }) {

  const [step, setStep] = useState("paste");
  const [allRows, setAllRows] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [hasHeader, setHasHeader] = useState(true);
  const [currency, setCurrency] = useState(opCurrency);
  const [mapping, setMapping] = useState({});
  const [preview, setPreview] = useState(null);
  const [pendingConflicts, setPendingConflicts] = useState(null);
  const [error, setError] = useState("");

  const ALL_FIELDS = [
    { key:"sku", label:"Ref partenaire" },
    { key:"refLdlc", label:"Ref LDLC" },
    { key:"designation", label:"Désignation" },
    { key:"budget", label:"Budget HT/pièce" },
    { key:"qty", label:"Ventes (quantité)" },
  ];

  const autoDetect = (hdrs) => {
    const a={};
    hdrs.forEach(h=>{ const hl=h.toLowerCase();
      if (!a.sku&&(hl.includes("sku")||hl.includes("part")||hl.includes("code")||hl.includes("partenaire")||(hl.includes("ref")&&!hl.includes("ldlc")))) a.sku=h;
      if (!a.refLdlc&&hl.includes("ldlc")) a.refLdlc=h;
      if (!a.designation&&(hl.includes("desig")||hl.includes("nom")||hl.includes("model")||hl.includes("produit")||hl.includes("libel"))) a.designation=h;
      if (!a.budget&&(hl.includes("budget")||hl.includes("montant")||hl.includes("prix")||hl.includes("amount"))) a.budget=h;
      if (!a.qty&&(hl.includes("qté")||hl.includes("qty")||hl.includes("quant")||hl.includes("vente")||hl.includes("sold")||hl.includes("vendu"))) a.qty=h;
    });
    return a;
  };

  const handleParse = () => {
    if (!pasteText.trim()) { setError("Collez des données depuis Excel."); return; }
    const parsed=parsePastedText(pasteText);
    if (!parsed.length) { setError("Aucune donnée."); return; }
    setAllRows(parsed);
    const looksLikeHeader=parsed[0].some(v=>isNaN(parseFloat(v))&&v.trim().length>0&&parseDate(v)==="");
    setHasHeader(looksLikeHeader);
    const hdrs=looksLikeHeader?parsed[0]:Array.from({length:Math.max(...parsed.map(r=>r.length))},(_,i)=>`Col. ${String.fromCharCode(65+i)}`);
    setHeaders(hdrs); setMapping(autoDetect(hdrs)); setError(""); setStep("map");
  };
  const toggleHeader = () => {
    const next=!hasHeader; setHasHeader(next);
    const hdrs=next?allRows[0]:Array.from({length:Math.max(...allRows.map(r=>r.length))},(_,i)=>`Col. ${String.fromCharCode(65+i)}`);
    setHeaders(hdrs); setMapping(autoDetect(hdrs)); setPreview(null);
  };
  const buildPreview = () => {
    if (!mapping.sku&&!mapping.refLdlc&&!mapping.budget&&!mapping.qty) { setError("Mappez au moins une colonne."); return; }
    const get=k=>mapping[k]?headers.indexOf(mapping[k]):-1;
    const iS=get("sku"),iL=get("refLdlc"),iD=get("designation"),iB=get("budget"),iQ=get("qty");
    const keyCol=iS>=0?iS:iL;
    const dataRows=hasHeader?allRows.slice(1):allRows;
    const noRefCol = iS<0 && iL<0;
    const rawRows=dataRows
      .filter(r=>noRefCol || (r[keyCol]!=null&&String(r[keyCol]).trim()!==""))
      .map((r,rowIdx)=>({
        sku: iS>=0?String(r[iS]||"").trim():"",
        refLdlc: iL>=0?String(r[iL]||"").trim():"",
        designation: iD>=0?String(r[iD]||"").trim():"",
        budget: iB>=0?(parseFloat(String(r[iB]||"").replace(/[^0-9,.-]/g,"").replace(",","."))||null):null,
        currency,
        qty: iQ>=0?Math.max(0,parseFloat(String(r[iQ]||"").replace(/[^0-9,.-]/g,"").replace(",","."))||0):null,
        _rowIdx: rowIdx, // for position-based matching
      }));
    if (!rawRows.length) { setError("Aucune ligne valide."); return; }
    // Aggregate: sum qty for duplicate refs
    const seen={};
    rawRows.forEach(r=>{
      const key=r.sku||r.refLdlc||("__pos_"+r._rowIdx);
      if(seen[key]){
        if(r.qty!=null) seen[key].qty=(seen[key].qty||0)+(r.qty||0);
        if(r.budget!=null&&seen[key].budget==null) seen[key].budget=r.budget;
      } else { seen[key]={...r}; }
    });
    const rows=Object.values(seen);
    setPreview(rows); setError(""); setStep("preview");
  };
  const findExisting=(row,idx)=>existingProducts.find((p,pi)=>{
    if(row.sku&&p.sku&&row.sku.toLowerCase()===p.sku.toLowerCase()) return true;
    if(row.refLdlc&&p.refLdlc&&row.refLdlc.toLowerCase()===p.refLdlc.toLowerCase()) return true;
    if(!row.sku&&!row.refLdlc&&pi===idx) return true; // position-based
    return false;
  });
  const handleConfirmPreview = () => {
    const conflicts=[];
    preview.forEach((row,ri)=>{ const ex=findExisting(row,ri); if(!ex) return; const id=row.sku||row.refLdlc;
      const chk=(f,l,nv)=>{ if(nv===null||nv===undefined||nv==="") return; const cur=ex[f]; if(!cur&&cur!==0) return; if(String(cur)!==String(nv)) conflicts.push({sku:id,field:l,current:cur,incoming:nv}); };
      chk("budget","Budget HT",row.budget); chk("qty","Ventes",row.qty); chk("designation","Désignation",row.designation);
    });
    if (conflicts.length>0) setPendingConflicts(conflicts); else doApply(preview);
  };
  const doApply=rows=>{ onApply(rows,currency); setPendingConflicts(null); };

  return (
    <>
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1200, padding:16 }}>
        <div style={{ background:"#0f172a", border:"1px solid rgba(255,255,255,0.12)", borderRadius:18, width:"100%", maxWidth:660, maxHeight:"92vh", overflowY:"auto", padding:32 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
            <h2 style={{ margin:0, color:"#f1f5f9", fontSize:19, fontWeight:800 }}>Coller des données</h2>
            <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", fontSize:24, cursor:"pointer" }}>✕</button>
          </div>
          {step==="paste"&&(
            <>
              <div style={{ color:"#9ca3af", fontSize:12, marginBottom:8 }}>
                Sélectionnez vos cellules dans votre tableau Excel ou Outlook, puis copiez-les et collez-les ici.
              </div>
              <textarea value={pasteText} onChange={e=>{setPasteText(e.target.value);setError("");}} autoFocus
                placeholder="Collez ici (Ctrl+V)…"
                style={{ ...inp, minHeight:150, resize:"vertical", fontFamily:"monospace", fontSize:13, lineHeight:1.7, marginBottom:14 }} />
              {error&&<div style={{ color:"#fca5a5", fontSize:13, marginBottom:10 }}>{error}</div>}
              <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                <button onClick={onClose} style={btnG}>Annuler</button>
                <button onClick={handleParse} style={btnP}>Analyser →</button>
              </div>
            </>
          )}
          {step==="map"&&(
            <>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12, background:"rgba(255,255,255,0.04)", borderRadius:8, padding:"10px 14px" }}>
                <span style={{ color:"#94a3b8", fontSize:13 }}>La 1ère ligne contient les noms de colonnes</span>
                <button onClick={toggleHeader} style={{ background:hasHeader?"#22c55e":"rgba(255,255,255,0.08)", border:hasHeader?"none":"1px solid rgba(255,255,255,0.2)", color:"#fff", borderRadius:20, padding:"5px 16px", cursor:"pointer", fontSize:12, fontWeight:700 }}>{hasHeader?"✓ Oui":"Non"}</button>
              </div>
              {mapping.budget&&(
                <div style={{ marginBottom:12, background:"rgba(59,130,246,0.08)", border:"1px solid rgba(59,130,246,0.3)", borderRadius:9, padding:"11px 14px" }}>
                  <label style={{ ...lbl, color:"#93c5fd" }}>Devise des budgets</label>
                  <div style={{ display:"flex", gap:8 }}>
                    {["EUR","USD"].map(cur=>(
                      <button key={cur} onClick={()=>setCurrency(cur)} style={{ background:currency===cur?(cur==="EUR"?"#3b82f6":"#f59e0b"):"rgba(255,255,255,0.07)", border:currency===cur?"none":"1px solid rgba(255,255,255,0.15)", color:currency===cur?"#fff":"#94a3b8", borderRadius:8, padding:"8px 22px", cursor:"pointer", fontSize:14, fontWeight:700 }}>
                        {cur==="EUR"?"€ EUR":"$ USD"}
                      </button>
                    ))}
                  </div>
                </div>
              )}
              <div style={{ marginBottom:8, background:"rgba(255,255,255,0.03)", borderRadius:7, padding:"8px 12px", fontSize:12, color:"#64748b" }}>
                Colonnes : {headers.map((h,i)=><span key={i} style={{ color:"#93c5fd", marginRight:7 }}>{h}</span>)}
              </div>
              <div style={{ color:"#64748b", fontSize:12, marginBottom:10 }}>Laissez "— non présent —" si la colonne n'existe pas.</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:9, marginBottom:16 }}>
                {ALL_FIELDS.map(f=>(
                  <div key={f.key} style={{ ...(f.key==="qty"?{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"8px 10px"}:{}) }}>
                    <label style={lbl}>{f.label}</label>
                    <select value={mapping[f.key]||""} onChange={e=>setMapping(m=>({...m,[f.key]:e.target.value}))} style={sel}>
                      <option value="">— non présent —</option>
                      {headers.map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                  </div>
                ))}
              </div>
              {error&&<div style={{ color:"#fca5a5", fontSize:13, marginBottom:10 }}>{error}</div>}
              <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                <button onClick={()=>{setStep("paste");setError("");}} style={btnG}>← Retour</button>
                <button onClick={buildPreview} style={btnP}>Aperçu →</button>
              </div>
            </>
          )}
          {step==="preview"&&preview&&(
            <>
              <div style={{ color:"#86efac", fontSize:13, marginBottom:12, background:"rgba(34,197,94,0.1)", border:"1px solid rgba(34,197,94,0.3)", borderRadius:8, padding:"10px 14px" }}>
                ✓ {preview.length} ligne{preview.length>1?"s":""} prête{preview.length>1?"s":""}
              </div>
              <div style={{ maxHeight:280, overflowY:"auto", overflowX:"auto", marginBottom:14 }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                  <thead>
                    <tr style={{ borderBottom:"1px solid rgba(255,255,255,0.1)" }}>
                      {mapping.sku&&<th style={{ textAlign:"left", color:"#64748b", padding:"5px 9px", fontWeight:700, fontSize:11 }}>Ref partenaire</th>}
                      {mapping.refLdlc&&<th style={{ textAlign:"left", color:"#64748b", padding:"5px 9px", fontWeight:700, fontSize:11 }}>Ref LDLC</th>}
                      {mapping.designation&&<th style={{ textAlign:"left", color:"#64748b", padding:"5px 9px", fontWeight:700, fontSize:11 }}>Désignation</th>}
                      {mapping.budget&&<th style={{ textAlign:"left", color:"#64748b", padding:"5px 9px", fontWeight:700, fontSize:11 }}>Budget HT</th>}
                      {mapping.qty&&<th style={{ textAlign:"left", color:"#e2e8f0", padding:"5px 9px", fontWeight:700, fontSize:11 }}>Ventes</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {preview.map((p,i)=>{ const isNew=!findExisting(p,i); return (
                      <tr key={i} style={{ borderBottom:"1px solid rgba(255,255,255,0.06)", background:isNew?"rgba(59,130,246,0.04)":"transparent" }}>
                        {mapping.sku&&<td style={{ padding:"6px 9px", color:"#93c5fd", fontFamily:"monospace" }}>{p.sku}{isNew&&<span style={{ color:"#3b82f6", fontSize:9, marginLeft:5 }}>NEW</span>}</td>}
                        {mapping.refLdlc&&<td style={{ padding:"6px 9px", color:"#cbd5e1" }}>{p.refLdlc||"—"}</td>}
                        {mapping.designation&&<td style={{ padding:"6px 9px", color:"#cbd5e1" }}>{p.designation||"—"}</td>}
                        {mapping.budget&&<td style={{ padding:"6px 9px", color:"#e2e8f0" }}>{p.budget!=null?fmt(p.budget,currency):"—"}</td>}
                        {mapping.qty&&<td style={{ padding:"6px 9px", color:"#f1f5f9", fontWeight:700 }}>{p.qty!=null?p.qty.toLocaleString("fr-FR"):"—"}</td>}
                      </tr>
                    );})}
                  </tbody>
                </table>
              </div>
              <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                <button onClick={()=>setStep("map")} style={btnG}>← Modifier</button>
                <button onClick={handleConfirmPreview} style={{ ...btnP, background:"#22c55e" }}>✓ Importer</button>
              </div>
            </>
          )}
        </div>
      </div>
      {pendingConflicts&&<ConflictDialog conflicts={pendingConflicts} onConfirm={()=>doApply(preview)} onCancel={()=>setPendingConflicts(null)} />}
    </>
  );
}

// ─── Edition Modal ────────────────────────────────────────────────────────────
function EditionModal({ op, onSave, onClose, currentUser, allUsers=[], fetchRate }) {
  const isNew = !op?.id;
  const blank = { id:"", idLdlc:"", idPartner:"", fournisseur:"", marque:"", acheteur:currentUser?.name||"", contact:"", enseignes:[], dateStart:"", dateEnd:"", currency:"EUR", fxRate:1, docLdlc:"", docPartner:"", rapportDate:null, products:[], notes:"" };
  const [form, setForm] = useState(isNew?blank:{ ...blank, ...op, acheteur:op.acheteur||"" });
  const [showPaste, setShowPaste] = useState(false);
  const [alertMsg, setAlertMsg] = useState(null);
  const [dupConfirm, setDupConfirm] = useState(null);
  const [rapportReconfirm, setRapportReconfirm] = useState(false);
  const [confirmLeave, setConfirmLeave] = useState(false);
  const [fetchingRate, setFetchingRate] = useState(false);
  const initialForm = useRef(JSON.stringify(isNew?blank:{...blank,...op,acheteur:op?.acheteur||""}));
  const isDirty = JSON.stringify(form) !== initialForm.current;
  const tryClose = () => { if(isDirty) setConfirmLeave(true); else onClose(); };

  useEffect(()=>{
    const handler = e => { if(e.key==="Escape") tryClose(); };
    window.addEventListener("keydown", handler);
    return ()=>window.removeEventListener("keydown", handler);
  },[isDirty]);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // When currency changes, pre-fill rate with fallback; try live rate in background
  useEffect(()=>{
    if (form.currency==="EUR") { set("fxRate",1); return; }
    const fallback = FALLBACK_RATES[form.currency]||0.92;
    if (!form.fxRate||form.fxRate===1) set("fxRate", fallback);
    // Try to get live rate in background
    setFetchingRate(true);
    fetchFxToEur(form.currency).then(rate=>{
      if(rate) set("fxRate", rate);
      setFetchingRate(false);
    });
  },[form.currency]);

  const changeProd=(i,k,v)=>{
    if((k==="qty"||k==="budget")&&v!==""&&parseFloat(v)<0) return;
    setForm(f=>({ ...f, products:f.products.map((p,j)=>j===i?{...p,[k]:v}:p) }));
  };
  const checkDupRef=(i,k,v)=>{
    if(!(k==="sku"||k==="refLdlc")||!v.trim()) return;
    const vn=v.trim().toLowerCase();
    const dup=form.products.some((p,j)=>j!==i&&((k==="sku"&&(p.sku||"").trim().toLowerCase()===vn)||(k==="refLdlc"&&(p.refLdlc||"").trim().toLowerCase()===vn)));
    if(dup) setAlertMsg("Ce produit est déjà listé dans cette opération.");
  };
  const removeProd=i=>set("products",form.products.filter((_,j)=>j!==i));
  const addRow=()=>set("products",[...form.products,{ sku:"", refLdlc:"", designation:"", budget:"", qty:"" }]);

  const handlePasteApply=(rows,currency)=>{
    // Compute everything synchronously outside setForm
    const currentProducts = form.products;
    const opIsNew = currentProducts.length===0;
    const updatedProducts = [...currentProducts];
    const unknowns=[];

    rows.forEach((row,ri)=>{
      const idx = (row.sku||row.refLdlc)
        ? updatedProducts.findIndex(p=>
            (row.sku&&p.sku&&row.sku.toLowerCase()===p.sku.toLowerCase())||
            (row.refLdlc&&p.refLdlc&&row.refLdlc.toLowerCase()===p.refLdlc.toLowerCase()))
        : (row._rowIdx!=null&&row._rowIdx<updatedProducts.length?row._rowIdx:-1);

      if(idx>=0){
        const u={...updatedProducts[idx]};
        if(row.sku) u.sku=row.sku;
        if(row.refLdlc) u.refLdlc=row.refLdlc;
        if(row.designation) u.designation=row.designation;
        if(row.budget!=null) u.budget=row.budget;
        if(row.qty!=null) u.qty=Math.max(0,(parseFloat(u.qty)||0)+(row.qty||0));
        updatedProducts[idx]=u;
      } else if(opIsNew){
        updatedProducts.push({ sku:row.sku||"", refLdlc:row.refLdlc||"", designation:row.designation||"", budget:row.budget!=null?row.budget:"", qty:row.qty!=null?Math.max(0,row.qty):"" });
      } else {
        unknowns.push(row);
      }
    });

    setForm(f=>({...f, products:updatedProducts}));
    if(unknowns.length>0) setUnknownQueue(unknowns);
    setShowPaste(false);
  };
  const [unknownQueue, setUnknownQueue] = useState([]);
  const handleUnknownConfirm = (row) => {
    setForm(f=>({ ...f, products:[...f.products, { sku:row.sku||"", refLdlc:row.refLdlc||"", designation:row.designation||"", budget:row.budget!=null?row.budget:"", qty:row.qty!=null?Math.max(0,row.qty):"" }] }));
    setUnknownQueue(q=>q.slice(1));
  };
  const handleUnknownSkip = () => setUnknownQueue(q=>q.slice(1));

  const totalHT=computeTotal(form.products);
  const cur=form.currency||"EUR";
  const valid=(form.idLdlc.trim()||form.idPartner.trim())&&form.marque.trim()&&form.dateStart&&form.dateEnd&&(form.enseignes||[]).length>0&&form.products.length>0&&form.products.some(p=>(p.sku&&p.sku.trim())||(p.refLdlc&&p.refLdlc.trim()));

  const isNonEur = form.currency!=="EUR";
  const COLS=[
    { key:"sku",         label:"Ref partenaire", w:150 },
    { key:"refLdlc",     label:"Ref LDLC",       w:150 },
    { key:"designation", label:"Désignation",     w:null },
    { key:"budget",      label:"Budget HT",       w:80, type:"number" },
    { key:"_ttc",        label:"Budget TTC",      w:80, readOnly:true },
    ...(isNonEur?[{ key:"_hteur",  label:"Budget HT (€)",  w:90, readOnly:true },{ key:"_ttceur", label:"Budget TTC (€)", w:90, readOnly:true }]:[]),
    { key:"qty",         label:"Ventes",          w:80, type:"number" },
    { key:"_totalht",    label:"Total HT",        w:80, readOnly:true },
  ];

  return (
    <>
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.87)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:14 }} onClick={e=>{if(e.target===e.currentTarget)tryClose();}}>
        <div style={{ background:"#000", border:"1px solid rgba(255,255,255,0.1)", borderRadius:18, width:"100%", maxWidth:"75vw", maxHeight:"96vh", overflowY:"auto", padding:32 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22 }}>
            <div style={{ display:"flex", alignItems:"center", gap:14, flex:1 }}>
              <h2 style={{ margin:0, color:"#f1f5f9", fontSize:21, fontWeight:800 }}>{isNew?"Nouvelle opération":`Opération ${[form.marque, form.idPartner||form.idLdlc].filter(Boolean).join(" ")}`}</h2>
              {!isNew&&(()=>{
                const st=statusOf(form);
                const color=STATUS_COLOR[st];
                const labels={
                  doc_recu:"Traité — document comptable du partenaire reçu",
                  du_payer:"Déclaré — en attente du document comptable du partenaire",

                            <input type={c.type||"text"} min={c.key==="qty"?"0":undefined}
                              value={p[c.key]||""}
                              onChange={e=>{ let v=e.target.value; if((c.key==="qty"||c.key==="budget")&&v!==""&&parseFloat(v)<0)v="0"; changeProd(i,c.key,v); }}
                              onBlur={e=>checkDupRef(i,c.key,e.target.value)}
                              placeholder={c.key==="qty"?"0":""}
                              style={{ ...inp, fontSize:12, padding:"6px 7px", width:"100%", boxSizing:"border-box" }}
                            />
                          )}
                        </td>
                      ))}
                      <td style={{ padding:"3px 5px", textAlign:"center" }}>
                        <button onClick={()=>removeProd(i)} style={{ background:"rgba(239,68,68,0.12)", border:"1px solid rgba(239,68,68,0.35)", color:"#fca5a5", borderRadius:6, padding:"5px 8px", cursor:"pointer", fontSize:13 }}>✕</button>
                      </td>
                    </tr>
                  ))}
                  {form.products.length===0&&(
                    <tr><td colSpan={COLS.length+1} style={{ padding:"20px 0", textAlign:"center", color:"#475569", fontSize:13 }}>Aucun produit</td></tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* Boutons sous le tableau */}
            <div style={{ display:"flex", gap:10, marginTop:10 }}>
              <button onClick={addRow} style={{ ...btnG, fontSize:14, padding:"9px 20px" }}>+ Ajouter une ligne</button>
              <button onClick={()=>setShowPaste(true)} style={{ ...btnG, fontSize:14, padding:"9px 20px" }}>📋 Coller des données</button>
            </div>

            {/* Total dynamique selon statut */}
            {(()=>{
              const st = statusOf(form);
              const now = today();
              const endDate = form.dateEnd||"";
              const startDate = form.dateStart||"";
              const msDay = 86400000;
              const diffEnd = endDate ? Math.round((new Date(endDate) - new Date(now)) / msDay) : null;
              const diffStart = startDate ? Math.round((new Date(startDate) - new Date(now)) / msDay) : null;

              if (st === "en_cours" || st === "a_venir") {
                let label = null;
                if (st === "en_cours" && diffEnd !== null) {
                  label = `Fin de l'opération prévue dans ${diffEnd} jour${diffEnd > 1 ? "s" : ""}`;
                } else if (st === "a_venir" && diffStart !== null) {
                  label = `Début de l'opération dans ${diffStart} jour${diffStart > 1 ? "s" : ""}`;
                }
                if (!label) return null;
                return (
                  <div style={{ display:"flex", justifyContent:"flex-end", marginTop:12, paddingTop:12, borderTop:"1px solid rgba(255,255,255,0.08)" }}>
                    <div style={{ color:"#64748b", fontSize:13, fontStyle:"italic" }}>{label}</div>
                  </div>
                );
              }

              if (totalHT <= 0 && !(form.products||[]).some(p=>parseFloat(p.qty)>0)) return null;
              const isDue = st === "du_declarer" || st === "du_payer";
              const totalColor = isDue ? "#ef4444" : "#22c55e";
              const daysPast = diffEnd !== null ? -diffEnd : null;

              return (
                <div style={{ display:"flex", justifyContent:"flex-end", alignItems:"flex-end", gap:20, marginTop:12, paddingTop:12, borderTop:"1px solid rgba(255,255,255,0.08)" }}>
                  {isDue && daysPast !== null && daysPast > 0 && (
                    <div style={{ color:"#ef4444", fontSize:13, fontWeight:600, alignSelf:"center" }}>
                      Dû depuis {daysPast} jour{daysPast > 1 ? "s" : ""}
                    </div>
                  )}
                  <div style={{ textAlign:"right" }}>
                    <div style={{ color:totalColor, fontSize:21, fontWeight:800 }}>{fmt(totalHT,cur)}</div>
                    <div style={{ color:totalColor, fontSize:13, opacity:0.65, marginTop:2 }}>{fmt(totalHT*TVA,cur)} TTC</div>
                  </div>
                </div>
              );
            })()}
          </div>

          <div style={{ marginBottom:22 }}>
            <label style={lbl}>Notes internes</label>
            <textarea value={form.notes||""} onChange={e=>set("notes",e.target.value)} style={{ ...inp, minHeight:52, resize:"vertical" }} />
          </div>

          {!valid&&(
            <div style={{ color:"#f59e0b", fontSize:13, marginBottom:12, background:"rgba(245,158,11,0.08)", border:"1px solid rgba(245,158,11,0.2)", borderRadius:8, padding:"9px 12px" }}>
              Pour enregistrer : ID (LDLC ou Partenaire), Marque, dates de début et fin, au moins une Enseigne, et au moins un produit avec Ref partenaire ou Ref LDLC.
            </div>
          )}

          <div style={{ display:"flex", gap:12, justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", alignItems:"center", gap:14 }}>
              {(()=>{
                const endDate=form.dateEnd||"";
                const todayStr=today();
                const rapportReady=!endDate||endDate<=todayStr;
                const rapportDate=form.rapportDate||null;
                const handleExport=()=>{
                  if(rapportDate){ setRapportReconfirm(true); return; }
                  exportPdf({...form}); set("rapportDate",todayStr);
                };
                return (
                  <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                    <button
                      onClick={rapportReady?handleExport:undefined}
                      disabled={!rapportReady}
                      style={{ ...btnG, background:rapportReady?"rgba(59,130,246,0.15)":"rgba(255,255,255,0.04)", border:rapportReady?"1px solid #3b82f6":"1px solid rgba(255,255,255,0.1)", color:rapportReady?"#93c5fd":"#475569", fontWeight:600, cursor:rapportReady?"pointer":"not-allowed", opacity:rapportReady?1:0.6 }}>
                      ⏏️ Exporter le rapport
                    </button>
                    {!rapportReady&&endDate&&(
                      <span style={{ color:"#6b7280", fontSize:13 }}>Disponible à partir du {displayDate(endDate)}</span>
                    )}
                    {rapportReady&&!rapportDate&&(
                      <span style={{ color:"#3b82f6", fontSize:13 }}>Le rapport est prêt à être exporté</span>
                    )}
                    {rapportDate&&(
                      <span style={{ color:"#22c55e", fontSize:13 }}>Rapport généré le {displayDate(rapportDate)}</span>
                    )}
                  </div>
                );
              })()}
              {/* AlertModal for dup refs */}
              {alertMsg&&<AlertModal message={alertMsg} onClose={()=>setAlertMsg(null)} />}
              {/* ConfirmModal for unknown paste rows */}
              {unknownQueue&&unknownQueue.length>0&&<ConfirmModal
                message={`"${unknownQueue[0].sku||unknownQueue[0].refLdlc}" ne faisait pas partie de la liste initiale.

Voulez-vous quand même ajouter les ventes correspondantes ?`}
                onConfirm={()=>handleUnknownConfirm(unknownQueue[0])}
                onCancel={handleUnknownSkip}
              />}
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={onClose} style={btnG}>❌ Annuler</button>
              <button onClick={()=>valid&&onSave({...form,id:form.id||genId(),totalDu:totalHT||null})}
                style={{ ...btnP, opacity:valid?1:0.4, cursor:valid?"pointer":"not-allowed" }}>
                {isNew?"✔️ Créer l'opération":"✔️ Enregistrer"}
              </button>
            </div>
          </div>
        </div>
      </div>
      {showPaste&&<PasteModal onApply={handlePasteApply} onClose={()=>setShowPaste(false)} existingProducts={form.products} opCurrency={form.currency||"EUR"} />}
      {confirmLeave&&<ConfirmModal message="Vous avez des modifications non enregistrées.
Voulez-vous les enregistrer avant de quitter ?" confirmLabel="Enregistrer" cancelLabel="Abandonner" onConfirm={()=>{if(valid)onSave({...form,id:form.id||genId(),totalDu:totalHT||null});onClose();}} onCancel={()=>{setConfirmLeave(false);onClose();}} />}
      {rapportReconfirm&&<ConfirmModal message={`Le rapport a déjà été généré le ${displayDate(form.rapportDate)}.
Voulez-vous l'exporter à nouveau ?`} onConfirm={()=>{ exportPdf({...form}); set("rapportDate",today()); setRapportReconfirm(false); }} onCancel={()=>setRapportReconfirm(false)} />}
    </>
  );
}

function AlertModal({ message, onClose }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:9000, padding:16 }}>
      <div style={{ background:"#0f172a", border:"1px solid rgba(255,255,255,0.15)", borderRadius:14, padding:28, maxWidth:420, width:"100%", textAlign:"center" }}>
        <div style={{ color:"#f1f5f9", fontSize:15, marginBottom:22, lineHeight:1.6 }}>{message}</div>
        <button onClick={onClose} style={{ ...btnP, padding:"9px 28px" }}>OK</button>
      </div>
    </div>
  );
}
function ConfirmModal({ message, onConfirm, onCancel, confirmLabel="Oui", cancelLabel="Non" }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:9000, padding:16 }}>
      <div style={{ background:"#0f172a", border:"1px solid rgba(255,255,255,0.15)", borderRadius:14, padding:28, maxWidth:440, width:"100%", textAlign:"center" }}>
        <div style={{ color:"#f1f5f9", fontSize:15, marginBottom:22, lineHeight:1.6, whiteSpace:"pre-line" }}>{message}</div>
        <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
          <button onClick={onCancel} style={btnG}>{cancelLabel}</button>
          <button onClick={onConfirm} style={{ ...btnP, background:"#22c55e" }}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function UserProfileModal({ currentUser, onClose, onLogout }) {
  const [newPwd, setNewPwd] = useState("");
  const [newPwd2, setNewPwd2] = useState("");
  const [email, setEmail] = useState("");
  const [profFirstName, setProfFirstName] = useState("");
  const [profLastName, setProfLastName] = useState("");
  const [msg, setMsg] = useState("");

  useEffect(()=>{
    db.get("budgy_users_v1").then(users=>{
      const me = (users||[]).find(u=>u.id===currentUser.id);
      if(me?.email) setEmail(me.email);
      if(me?.firstName) setProfFirstName(me.firstName);
      if(me?.lastName) setProfLastName(me.lastName);
    });
  },[]);

  const save = async () => {
    const users = await db.get("budgy_users_v1") || [];
    let next = [...users];
    const fn = fmtPrenom(profFirstName), ln = fmtNom(profLastName);
    const newName = [fn, ln].filter(Boolean).join(" ") || currentUser.name;
    if (newPwd) {
      if (newPwd.length < 6) { setMsg("Mot de passe trop court (6 min)."); return; }
      if (newPwd !== newPwd2) { setMsg("Les mots de passe ne correspondent pas."); return; }
      const hash = await hashPassword(newPwd);
      next = next.map(u => u.id === currentUser.id ? { ...u, hash, email, firstName:fn, lastName:ln, name:newName } : u);
    } else {
      next = next.map(u => u.id === currentUser.id ? { ...u, email, firstName:fn, lastName:ln, name:newName } : u);
    }
    await db.set("budgy_users_v1", next);
    session.set({ ...currentUser, name:newName });
    setMsg("Profil mis à jour !"); setNewPwd(""); setNewPwd2("");
  };

  const changePhoto = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => { db.set("budgy_photo_" + currentUser.id, e.target.result); setMsg("Photo mise à jour !"); };
    reader.readAsDataURL(file);
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.87)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:4000, padding:16 }}>
      <div style={{ background:"#0f172a", border:"1px solid rgba(255,255,255,0.12)", borderRadius:18, width:"100%", maxWidth:420, padding:32 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22 }}>
          <h2 style={{ margin:0, color:"#f1f5f9", fontSize:18, fontWeight:800 }}>Mon profil</h2>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", fontSize:22, cursor:"pointer" }}>✕</button>
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:10, marginBottom:22 }}>
          <UserAvatar userId={currentUser.id} size={64} />
          <div style={{ color:"#f1f5f9", fontWeight:700, fontSize:16 }}>{currentUser.name}</div>
          {currentUser.role==="admin" && <span style={{ color:"#fcd34d", fontSize:11, fontWeight:700 }}>ADMIN</span>}
          <label style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.15)", color:"#9ca3af", borderRadius:7, padding:"6px 16px", cursor:"pointer", fontSize:13 }}>
            📷 Changer la photo
            <input type="file" accept="image/*" style={{ display:"none" }} onChange={e=>changePhoto(e.target.files[0])} />
          </label>
        </div>
        <div style={{ marginBottom:14 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
            <div><label style={lbl}>Prénom</label><input value={profFirstName} onChange={e=>setProfFirstName(e.target.value)} style={inp} /></div>
            <div><label style={lbl}>Nom</label><input value={profLastName} onChange={e=>setProfLastName(e.target.value)} style={inp} /></div>
          </div>
          <label style={lbl}>Adresse email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="prenom.nom@ldlc.com" style={{ ...inp, marginBottom:12 }} />
          <label style={lbl}>Nouveau mot de passe</label>
          <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} style={{ ...inp, marginBottom:8 }} />
          <label style={lbl}>Confirmer</label>
          <input type="password" value={newPwd2} onChange={e=>setNewPwd2(e.target.value)} style={inp} />
        </div>
        {msg && <div style={{ color:"#86efac", fontSize:13, marginBottom:12 }}>{msg}</div>}
        <button onClick={save} style={{ ...btnP, width:"100%", marginBottom:10 }}>Enregistrer</button>
        <button onClick={()=>{ onLogout(); onClose(); }} style={{ ...btnG, width:"100%", textAlign:"center" }}>Se déconnecter</button>
      </div>
    </div>
  );
}

function App() {
  const [ops, setOps] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editOp, setEditOp] = useState(undefined);
  const [filter, setFilter] = useState("all");
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [dateFilter, setDateFilter] = useState("all");
  const [acheteurFilter, setAcheteurFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [currentUser, setCurrentUser] = useState(null); // { id, name, role }
  const [showAdmin, setShowAdmin] = useState(false);
  const [showProfile, setShowProfile] = useState(false);
  const [darkMode, setDarkMode] = useState(true);
  const [pendingCount, setPendingCount] = useState(0);
  const [allUsers, setAllUsers] = useState([]);

  useEffect(()=>{
    Promise.all([db.get("promo_ops_v1"), Promise.resolve(session.get()), db.get("budgy_users_v1")]).then(([o, sessionData, users])=>{
      setOps(o||[]);
      if (sessionData?.id) setCurrentUser(sessionData);
      const allU=users||[];
      setAllUsers(allU.filter(u=>u.approved));
      setPendingCount(allU.filter(u=>!u.approved&&u.id!==ADMIN_ID).length);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  const isAdmin = currentUser?.role==="admin";
  const canEdit = (op) => isAdmin || op.createdBy===currentUser?.id;

  const persist=next=>{ setOps(next); db.set("promo_ops_v1",next); };
  const toggleRapport=(opId,val)=>{
    const d=val?new Date().toISOString().slice(0,10):null;
    const next=ops.map(o=>o.id===opId?{...o,rapportDate:d}:o);
    persist(next);
  };
  const saveOp=op=>{
    const toSave={...op, id:op.id||genId(), createdBy:op.createdBy||currentUser?.id, acheteur:op.acheteur||currentUser?.name||""};
    const idx=ops.findIndex(o=>o.id===toSave.id);
    persist(idx>=0?ops.map((o,i)=>i===idx?toSave:o):[...ops,toSave]);
    setEditOp(undefined);
  };
  const doDelete=()=>{ persist(ops.filter(o=>o.id!==confirmDelete)); setConfirmDelete(null); };
  const handleLogout=()=>{ session.set(null); setCurrentUser(null); };

  const allOps=ops.map(o=>({...o,status:statusOf(o)}));

  const ENSEIGNE_ALIASES = {
    "ldlc.com":      ["ldlc","ldlccom","ldlc.com"],
    "ldlc.pro":      ["ldlcpro","ldlc.pro"],
    "materiel.net":  ["materiel","materielnet","materiel.net","matos"],
    "topachat":      ["topachat","topachat","ta"],
    "rueducommerce":  ["rueducommerce","ruedu","rdc","rue du commerce","rueduc"],
  };
  const matchesEnseigne = (op, s) => {
    const opEnseignes = (op.enseignes||[]).map(e=>norm(e));
    return opEnseignes.some(e => {
      if (e.includes(s)||s.includes(e)) return true;
      const aliases = ENSEIGNE_ALIASES[e]||[];
      return aliases.some(a=>a.includes(s)||s.includes(a));
    });
  };
  const matchesYear = (op, s) => {
    const yr = s.match(/^(20\d{2})$/);
    if (!yr) return false;
    return (op.dateStart||"").startsWith(yr[1])||(op.dateEnd||"").startsWith(yr[1]);
  };
  const matchSearch=o=>{
    if (!search) return true;
    const s=norm(search.trim());
    if (!s) return true;
    return (
      norm(o.id).includes(s)||
      norm(o.idLdlc).includes(s)||
      norm(o.idPartner).includes(s)||
      norm(o.fournisseur).includes(s)||
      norm(o.marque).includes(s)||
      norm(o.acheteur).includes(s)||
      (o.products||[]).some(p=>norm(p.sku).includes(s)||norm(p.refLdlc).includes(s)||norm(p.designation).includes(s))||
      matchesEnseigne(o,s)||
      matchesYear(o,s)
    );
  };

  const applyDateFilter = (op) => {
    if (dateFilter==="all") return true;
    const end = op.dateEnd;
    if (!end) return dateFilter==="all";
    const endMs = new Date(end).getTime();
    const nowMs = Date.now();
    const todayY = new Date().getFullYear();
    if (dateFilter==="year") return new Date(end).getFullYear()===todayY;
    if (dateFilter==="90") return (nowMs-endMs) <= 90*86400000 || endMs>=nowMs;
    if (dateFilter==="60") return (nowMs-endMs) <= 60*86400000 || endMs>=nowMs;
    if (dateFilter==="30") return (nowMs-endMs) <= 30*86400000 || endMs>=nowMs;
    return true;
  };
  const applyAcheteurFilter = (op) => acheteurFilter==="all" || op.acheteur===acheteurFilter;
  const acheteurNames = allUsers
    .map(u=>fullName(u)||u.name)
    .filter(Boolean)
    .filter((name,i,arr)=>arr.indexOf(name)===i)
    .filter(name=>allOps.some(o=>o.acheteur===name))
    .sort((a,b)=>a.localeCompare(b));
  const filtered=allOps.filter(o=>(filter==="all"||o.status===filter)&&matchSearch(o)&&applyDateFilter(o)&&applyAcheteurFilter(o));
  const searchOnly=allOps.filter(o=>matchSearch(o)&&applyDateFilter(o)&&applyAcheteurFilter(o));

  const kpiAmt=statuses=>searchOnly.filter(o=>statuses.includes(o.status)).reduce((sum,o)=>{
    const t=computeTotal(o.products||[]);
    return sum+toEur(t,o.currency||"EUR",o.fxRate||0.92);
  },0);
  const kpiCnt=statuses=>searchOnly.filter(o=>statuses.includes(o.status)).length;

  // Aggregate EUR for display (best-effort)
  const fmtKpi=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);

  const handleSort=(col)=>{
    if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortCol(col); setSortDir("asc"); }
  };
  const sortedFiltered=[...filtered].sort((a,b)=>{
    if(!sortCol) return 0;
    const getV=(o)=>({
      marque:o.marque||"",fournisseur:o.fournisseur||o.marque||"",acheteur:o.acheteur||"",
      idPartner:o.idPartner||"",
      periode:o.dateEnd||"",montant:computeTotal(o.products||[]),
      docPartner:o.docPartner||"",declare:o.rapportDate||"",
    }[sortCol]||"");
    const va=getV(a),vb=getV(b);
    const cmp=typeof va==="number"?va-vb:String(va).localeCompare(String(vb),"fr");
    return sortDir==="asc"?cmp:-cmp;
  });

  const handleExportResultsPdf = () => {
    const logoEl = document.querySelector('img[alt="Groupe LDLC"]');
    const LOGO = logoEl ? logoEl.src : '';
    const filterLabels = { all:"Tous les statuts", doc_recu:"Traité", du_payer:"Déclaré", du_declarer:"À déclarer", en_cours:"En cours", a_venir:"À venir" };
    const dateFilterLabels = { all:"Toutes les périodes", year:"Année en cours", "90":"90 derniers jours", "60":"60 derniers jours", "30":"30 derniers jours" };
    const exportDate = new Date().toLocaleDateString("fr-FR", { day:"2-digit", month:"long", year:"numeric" });
    const exportTime = new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
    const STATUS_COLORS_PDF = { doc_recu:"#15803d", du_payer:"#b91c1c", du_declarer:"#c2410c", en_cours:"#854d0e", a_venir:"#1d4ed8" };
    const STATUS_BG_PDF = { doc_recu:"#dcfce7", du_payer:"#fee2e2", du_declarer:"#ffedd5", en_cours:"#fef9c3", a_venir:"#dbeafe" };
    const kpis = [
      { label:"Traité",      count:kpiCnt(["doc_recu"]),    amount:fmtKpi(kpiAmt(["doc_recu"])),  color:"#15803d", bg:"#dcfce7" },
      { label:"Déclaré",     count:kpiCnt(["du_payer"]),    amount:fmtKpi(kpiAmt(["du_payer"])),  color:"#b91c1c", bg:"#fee2e2" },
      { label:"À déclarer",  count:kpiCnt(["du_declarer"]), amount:null,                           color:"#c2410c", bg:"#ffedd5" },
      { label:"En cours",    count:kpiCnt(["en_cours"]),    amount:null,                           color:"#854d0e", bg:"#fef9c3" },
      { label:"À venir",     count:kpiCnt(["a_venir"]),     amount:null,                           color:"#1d4ed8", bg:"#dbeafe" },
    ];
    const kpiHtml = kpis.map(k => {
      const cs = k.count === 0 ? "Aucune opération" : k.count === 1 ? "1 opération" : k.count + " opérations";
      return '<div class="kpi" style="border-top-color:' + k.color + ';background:' + k.bg + '">'
        + '<div class="kpi-label">' + k.label + '</div>'
        + '<div class="kpi-value" style="color:' + k.color + '">' + cs + (k.amount ? ' <span class="kpi-amt">(' + k.amount + ')</span>' : '') + '</div>'
        + '</div>';

          <KpiCard label="À déclarer"  emoji="📩"  accentColor="#f97316" textColor="#fdba74" amount={null} count={kpiCnt(["du_declarer"])} onClick={()=>setFilter(f=>f==="du_declarer"?"all":"du_declarer")} active={filter==="du_declarer"} darkMode={darkMode} />
          <KpiCard label="En cours"    emoji="▶️"  accentColor="#eab308" textColor="#fde047" amount={null} count={kpiCnt(["en_cours"])}   onClick={()=>setFilter(f=>f==="en_cours"?"all":"en_cours")}    active={filter==="en_cours"}    darkMode={darkMode} />
          <KpiCard label="À venir"     emoji="⏭️"  accentColor="#3b82f6" textColor="#93c5fd" amount={null} count={kpiCnt(["a_venir"])}    onClick={()=>setFilter(f=>f==="a_venir"?"all":"a_venir")}      active={filter==="a_venir"}     darkMode={darkMode} />
        </div>

        {/* Ligne 1 : filtre statut */}
        <div style={{ display:"flex", gap:7, marginBottom:8, flexWrap:"wrap" }}>
          {[["all","Tous les statuts"],["doc_recu","Traité"],["du_payer","Déclaré"],["du_declarer","À déclarer"],["en_cours","En cours"],["a_venir","À venir"]].map(([v,l])=>(
            <button key={v} onClick={()=>setFilter(v)} style={{ background:filter===v?(darkMode?"rgba(255,255,255,0.15)":"#374151"):"rgba(255,255,255,0.04)", border:"1px solid "+(filter===v?(darkMode?"rgba(255,255,255,0.35)":"#374151"):"rgba(255,255,255,0.1)"), color:filter===v?"#fff":"#9ca3af", borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:13, fontWeight:filter===v?600:400 }}>{l}</button>
          ))}
        </div>
        {/* Ligne 2 : filtre date */}
        <div style={{ display:"flex", gap:7, marginBottom:12, flexWrap:"wrap" }}>
          {[["all","Toutes les périodes"],["year","Année en cours"],["90","90 derniers jours"],["60","60 derniers jours"],["30","30 derniers jours"]].map(([v,l])=>(
            <button key={v} onClick={()=>setDateFilter(v)} style={{ background:dateFilter===v?(darkMode?"rgba(255,255,255,0.15)":"#374151"):"rgba(255,255,255,0.04)", border:"1px solid "+(dateFilter===v?(darkMode?"rgba(255,255,255,0.35)":"#374151"):"rgba(255,255,255,0.1)"), color:dateFilter===v?"#fff":"#9ca3af", borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:13, fontWeight:dateFilter===v?600:400 }}>{l}</button>
          ))}
        </div>
        {/* Ligne 3 : filtre acheteur */}
        <div style={{ display:"flex", gap:7, marginBottom:12, flexWrap:"wrap" }}>
          {[["all","Tous les acheteurs"], ...acheteurNames.map(n=>[n,n])].map(([v,l])=>(
            <button key={v} onClick={()=>setAcheteurFilter(v)} style={{ background:acheteurFilter===v?(darkMode?"rgba(255,255,255,0.15)":"#374151"):"rgba(255,255,255,0.04)", border:"1px solid "+(acheteurFilter===v?(darkMode?"rgba(255,255,255,0.35)":"#374151"):"rgba(255,255,255,0.1)"), color:acheteurFilter===v?"#fff":"#9ca3af", borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:13, fontWeight:acheteurFilter===v?600:400 }}>{l}</button>
          ))}
        </div>
        {/* Recherche + Nouvelle opération */}
        <div style={{ display:"flex", gap:10, marginBottom:16, alignItems:"center" }}>
          <input placeholder="🔎  Filtrer : par marque, fournisseur, acheteur, ID, référence produit, enseigne, année…" value={search} onChange={e=>setSearch(e.target.value)} style={{ ...inp, flex:1, background:"#111", border:"1px solid rgba(255,255,255,0.08)", color:"#e2e8f0" }} />
          <button onClick={()=>setEditOp(null)} style={{ ...btnP, padding:"9px 20px", whiteSpace:"nowrap", flexShrink:0 }}>+ Nouvelle opération</button>
        </div>

        {/* Tableau */}
        <div style={{ background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, overflow:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14, minWidth:860 }}>
            <thead>
              <tr style={{ borderBottom:"1px solid rgba(255,255,255,0.09)", background:"rgba(255,255,255,0.03)" }}>
                {[["Marque","marque"],["Fournisseur","fournisseur"],["Enseignes",null],["Acheteur","acheteur"],["ID Partenaire","idPartner"],["Doc Partenaire","docPartner"],["Période","periode"],["Montant","montant"],["Statut",null],["",null]].map(([h,col])=>(
                  <th key={h} onClick={col?()=>handleSort(col):undefined} style={{ textAlign:"left", color:sortCol===col?"#f1f5f9":"#9ca3af", padding:"11px 13px", fontWeight:700, fontSize:11, textTransform:"uppercase", letterSpacing:0.6, whiteSpace:"nowrap", cursor:col?"pointer":"default", userSelect:"none" }}>
                    {h}{col&&sortCol===col?(sortDir==="asc"?" ↑":" ↓"):""}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0&&(
                <tr><td colSpan={9} style={{ padding:48, textAlign:"center", color:"#334155", fontSize:14 }}>
                  {ops.length===0?'Aucune opération — cliquez sur "+ Nouvelle opération" pour commencer':"Aucun résultat"}
                </td></tr>
              )}
              {sortedFiltered.map(op=>{
                const totalHT=computeTotal(op.products||[]);
                const totalTTC=totalHT*TVA;
                const cur=op.currency||"EUR";
                const color=STATUS_COLOR[op.status];
                const fournisseur=op.fournisseur&&op.fournisseur!==op.marque?op.fournisseur:(op.fournisseur||op.marque||"—");
                const periodStr=(op.dateStart&&op.dateEnd)?`${displayDate(op.dateStart)} → ${displayDate(op.dateEnd)}`:"—";
                return (
                  <tr key={op.id}
                    onClick={e=>{ if(e.target.type==="checkbox"||e.target.closest("button")) return; setEditOp(op); }}
                    style={{ borderBottom:"1px solid rgba(255,255,255,0.06)", background:`${color}30`, cursor:"pointer" }}
                    onMouseEnter={e=>e.currentTarget.style.background=`${color}50`}
                    onMouseLeave={e=>e.currentTarget.style.background=`${color}30`}>
                    <td style={{ padding:"12px 13px", color:"#f1f5f9", fontWeight:700, fontSize:14 }}>{op.marque||"—"}</td>
                    <td style={{ padding:"12px 13px", color:"#e2e8f0", fontSize:14 }}>{fournisseur}</td>
                    <td style={{ padding:"12px 13px" }}>
                      <div style={{ display:"flex", gap:4, flexWrap:"wrap", alignItems:"center" }}>
                        {(op.enseignes||[]).map(e=>FAVICON_MAP[e]?(
                          <img key={e} src={FAVICON_MAP[e]} title={e} style={{ width:16, height:16, objectFit:"contain", borderRadius:2 }} onError={ev=>ev.target.style.display="none"} />
                        ):null)}
                      </div>
                    </td>
                    <td style={{ padding:"12px 13px", color:"#e2e8f0", fontSize:13 }}>{op.acheteur||""}</td>
                    <td style={{ padding:"12px 13px", color:"#d1d5db", fontFamily:"monospace", fontSize:12 }}>{op.idPartner||"—"}</td>
                    <td style={{ padding:"12px 13px", fontSize:12, fontFamily:"monospace" }}>{op.docPartner?<span style={{color:"#d1d5db"}}>{op.docPartner}</span>:<span style={{color:"#334155"}}>—</span>}</td>
                    <td style={{ padding:"12px 13px", color:"#d1d5db", fontSize:13, whiteSpace:"nowrap" }}>{periodStr}</td>
                    <td style={{ padding:"12px 13px", whiteSpace:"nowrap" }}>
                      {totalHT>0
                        ? <div style={{ color:STATUS_COLOR[op.status]||color, fontWeight:800, fontSize:15 }}>{fmt(totalHT,cur)}</div>
                        : (op.products||[]).some(p=>parseFloat(p.qty)>0)
                          ? <span style={{ color:color, fontSize:13 }}>Ventes sans budget</span>
                          : <span style={{ color:"#334155" }}>—</span>}
                    </td>
                    <td style={{ padding:"8px 13px" }}>
                      <span style={{ background:`${STATUS_COLOR[op.status]}20`, border:`1px solid ${STATUS_COLOR[op.status]}55`, color:STATUS_COLOR[op.status], borderRadius:6, padding:"3px 9px", fontSize:11, fontWeight:600, whiteSpace:"nowrap" }}>
                        {STATUS_LABELS[op.status]||op.status}
                      </span>
                    </td>
                    <td style={{ padding:"8px 10px", textAlign:"center" }}>
                      {canEdit(op)&&<button onClick={e=>{e.stopPropagation();setConfirmDelete(op.id);}} style={{ background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.35)", color:"#fca5a5", borderRadius:7, padding:"6px 9px", cursor:"pointer", fontSize:14 }}>🗑</button>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{ display:"flex", justifyContent:"flex-end", marginTop:14 }}>
          <button onClick={handleExportResultsPdf} style={{ ...btnP, padding:"9px 20px", display:"flex", alignItems:"center", gap:8 }}>
            📤 Exporter les résultats
          </button>
        </div>
      </div>

      {editOp!==undefined&&<EditionModal op={editOp} onSave={saveOp} onClose={()=>setEditOp(undefined)} currentUser={currentUser} allUsers={allUsers} />}
      {confirmDelete&&<ConfirmDialog message="Supprimer définitivement cette opération ?" onConfirm={doDelete} onCancel={()=>setConfirmDelete(null)} />}
      {showAdmin&&isAdmin&&<AdminPanel currentUser={currentUser} onClose={()=>{ setShowAdmin(false); db.get("budgy_users_v1").then(u=>{ const all=u||[]; setAllUsers(all.filter(u=>u.approved)); setPendingCount(all.filter(u=>!u.approved&&u.id!==ADMIN_ID).length); }); }} />}
      {showProfile&&<UserProfileModal currentUser={currentUser} onClose={()=>setShowProfile(false)} onLogout={handleLogout} />}
    </div>
    </>
  );
}


    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
